name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release version
        run: |
          source manifests/versions.env
          test "v${PROJECT_VERSION}" = "${GITHUB_REF_NAME}"
          bash tests/test.sh
      - name: Build release archive
        run: |
          mkdir -p dist
          git archive --format=tar --prefix="nvim-go-ide-${GITHUB_REF_NAME}/" HEAD \
            | gzip -9 >"dist/nvim-go-ide-${GITHUB_REF_NAME}.tar.gz"
          cd dist
          sha256sum "nvim-go-ide-${GITHUB_REF_NAME}.tar.gz" >SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
