name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.4
      - name: Check shell scripts
        run: shellcheck bootstrap.sh bin/nvim-go lib/*.sh tests/*.sh
      - name: Run static tests
        run: bash tests/test.sh
      - name: Check Lua syntax
        run: find config -name '*.lua' -print0 | xargs -0 -n1 luac -p

  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the complete environment
        run: ./bin/nvim-go install
      - name: Diagnose the installation
        run: ~/.local/bin/nvim-go doctor
